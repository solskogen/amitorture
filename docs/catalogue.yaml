# amitorture coverage catalogue (the plan's "Coverage: everything an Amiga can do").
#
# Every capability of every Amiga model and expansion the emulator offers,
# mapped to the case keys that test it. REPORT.md evaluates it on every run
# (runner/amitorture/catalogue.py): covered (a matching case passed or
# failed), partial (only skip/untestable, or only part is reachable), or
# not_covered (no matching case ran, or no test can reach it: reason given).
#
# Format (a YAML subset; see catalogue.py): one mapping per capability.
#   id           stable capability id
#   area         catalogue section
#   what         the capability
#   cases        fnmatch globs over "<module>.<case>" keys (docs/cases/<module>.md)
#   entries      optional globs over matrix entry ids: only cases from those entries count
#   partial      optional: why the best possible result is partial
#   not_covered  optional: why no test covers it (then no cases needed)
#   needs        optional: hardware/ROM/config it needs
# Module agents: refine the globs to your case ids when you add cases.

# ----------------------------------------------------------------- CPU
- id: cpu.integer
  area: CPU
  what: 68000-68060 integer ISA, every opcode family and addressing mode
  cases: [cpu_basic.*, flags.*, dispatch.*]

- id: cpu.fpu
  area: CPU
  what: FPU 68881/68882/68040/68060 (conversions, arithmetic, transcendental, FSAVE/FRESTORE, exceptions)
  cases: [fpu.*]

- id: cpu.mmu
  area: CPU
  what: MMU 68030/68040/68060 (translation tables, TTRs, ATC, PTEST/PFLUSH, bus errors)
  cases: [mmu.*]

- id: cpu.caches
  area: CPU
  what: caches (CACR, instruction/data cache, burst, write-allocate, copyback, CPUSH/CINV)
  cases: [smc.ic_*, smc.cpush*, smc.cinv*, smc.cacr*, smc.loop_selfmod_icoff, memory.*cache*, memory.*copyback*, memory.*burst*]
  partial: burst and write-allocate are visible only through timing, not through results

- id: cpu.move16_cas_bitfields
  area: CPU
  what: MOVE16, CAS/CAS2, bitfield instructions
  cases: [cpu_basic.cas*, cpu_basic.bf*, cpu_basic.*move16*, memory.*move16*, dispatch.*bf*]

- id: cpu.exceptions
  area: CPU
  what: all exception types and stack frame formats per CPU variant
  cases: [exceptions.*]

- id: cpu.trace_stop
  area: CPU
  what: trace (T1/T0) and STOP
  cases: [exceptions.trace*, exceptions.hot_trace, interrupts.stop*]

- id: cpu.vbr_movec_moves
  area: CPU
  what: VBR, MOVEC, MOVES
  cases: [exceptions.*movec*, exceptions.*vbr*, cpu_basic.*movec*, mmu.*moves*, memory.*moves*, probe.hello]
  partial: VBR/CACR are read by the probe and used by every BARE module; MOVES is only reached by the mmu/memory modules

- id: cpu.060_unimplemented
  area: CPU
  what: 68060 unimplemented-instruction traps (integer and FPU, no FPSP)
  cases: [exceptions.unimpl060*, fpu.unimp*, fpu.effadd*_060]

- id: cpu.self_modifying
  area: CPU
  what: self-modifying code, prefetch, code written by DMA
  cases: [smc.*]

- id: cpu.timing
  area: CPU
  what: instruction throughput fingerprint
  cases: [timing.*]

- id: cpu.jit_parity
  area: CPU
  what: the JIT gives the same results as the interpreter (twins; amt_hot loops)
  cases: [cpu_basic.*, flags.*, fpu.*, dispatch.*]
  entries: [*-jit*]

